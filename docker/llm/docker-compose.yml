name: anythingllm-llm

services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OLLAMA_MODEL: deepseek-r1:8b
    image: anythingllm-ollama-deepseek:local
    container_name: anythingllm-ollama
    restart: unless-stopped
    ports:
      - "4686:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ./ollama:/root/.ollama

